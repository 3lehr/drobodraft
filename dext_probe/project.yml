name: DextProbe
options:
  bundleIdPrefix: de.begod.drobo
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: JR9H9Q532P
    CODE_SIGN_STYLE: Automatic
targets:
  DextProbeHost:
    type: application
    platform: macOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.begod.drobo.dextprobe
        CODE_SIGN_ENTITLEMENTS: Host/Host.entitlements
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: DextProbeDext
        embed: true
  DextProbeDext:
    type: driver-extension
    platform: macOS  # xcodegen kennt DriverKit nicht; SDKROOT unten ueberschreibt
    sources: [Dext]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.begod.drobo.dextprobe.dext
        PRODUCT_NAME: de.begod.drobo.dextprobe
        CODE_SIGN_ENTITLEMENTS: Dext/Dext.entitlements
        INFOPLIST_FILE: Dext/Info.plist
        SDKROOT: driverkit
        DRIVERKIT_DEPLOYMENT_TARGET: "23.0"
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        OTHER_LDFLAGS: "-framework DriverKit -framework SCSIPeripheralsDriverKit"
        ARCHS: arm64
