# xcodegen: `xcodegen` erzeugt DroboFSProbe.xcodeproj (nicht eingecheckt). Vorher: `make -C ../` (liblivefiles_hfs.a).
name: DroboFSProbe
options:
  developmentLanguage: de
  deploymentTarget:
    macOS: "15.4"
configFiles:
  Debug: Identity.xcconfig
  Release: Identity.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: $(DROBO_TEAM)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "2.0"
packages:
  DroboKern:
    path: ../drobo_kern
targets:
  DroboFSProbe:
    type: application
    platform: macOS
    info:
      path: App/Info.plist
      properties:
        CFBundleName: DroboDraft
        CFBundleDisplayName: DroboDraft
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [de]
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSRemovableVolumesUsageDescription: "Die Drobo-App braucht Zugriff auf das Laufwerk, um es einzuhängen."
        NSLocalNetworkUsageDescription: "DroboDraft verbindet sich per iSCSI mit deiner DroboPro im lokalen Netzwerk."
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DROBO_BUNDLE_PREFIX).drobofsprobe
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleName: DroboDraft
        INFOPLIST_KEY_CFBundleDisplayName: DroboDraft
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      - name: Dienst-Beschreibung (launchd) mit Praefix erzeugen
        script: |
          D="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          mkdir -p "$D" && rm -f "$D"/*.plist
          sed "s/@PREFIX@/${DROBO_BUNDLE_PREFIX}/g" "${SRCROOT}/Helper/drobohelper.plist.in" > "$D/${DROBO_BUNDLE_PREFIX}.drobohelper.plist"
        inputFiles: [$(SRCROOT)/Helper/drobohelper.plist.in]
        outputFiles: [$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/$(DROBO_BUNDLE_PREFIX).drobohelper.plist]
    dependencies:
      - package: DroboKern
        product: DroboKern
      - sdk: DiskArbitration.framework
      - target: DroboFSProbeModule
        embed: true
      - target: DroboFSProbeISCSI
        embed: true
      - target: DroboFSProbeHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
  DroboFSProbeHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes: ["*.plist"]
      - ../drobo_kern/Sources/DroboKern/HelferLogik.swift
      - ../drobo_kern/Sources/DroboKern/Identitaet.swift
      - ../drobo_kern/Sources/DroboKern/Medium.swift
      - ../drobo_kern/Sources/DroboKern/Freigabe.swift
      - ../drobo_kern/Sources/DroboKern/Fehler.swift
    settings:
      base:
        PRODUCT_NAME: drobohelper
        PRODUCT_BUNDLE_IDENTIFIER: $(DROBO_BUNDLE_PREFIX).drobohelper
        ENABLE_HARDENED_RUNTIME: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: DiskArbitration.framework
  DroboFSProbeModule:
    type: app-extension
    platform: macOS
    sources:
      - Module
      - ../drobo_kern/Sources/DroboKern/DroboStatus.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DROBO_BUNDLE_PREFIX).drobofsprobe.fsmodule
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Module/DroboFSProbeModule.entitlements
        INFOPLIST_FILE: Module/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Module/Bridge.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/../livefiles_shim"]
        OTHER_LDFLAGS: ["$(SRCROOT)/../build/liblivefiles_hfs.a", "-framework", "CoreFoundation", "-framework", "IOKit"]
  DroboFSProbeISCSI:
    # Zweites FSKit-Modul nur fuer Netzwerk-Adressen (iscsi://, FSGenericURLResource). Getrennt vom Block-Modul,
    # weil Block+URL in einem Modul gemessen das Modul fuer mount -F unauffindbar machte (Plan DroboPro Schritt 2).
    type: app-extension
    platform: macOS
    sources:
      - Module
      - ../drobo_kern/Sources/DroboKern/DroboStatus.swift
      - ../drobo_kern/Sources/DroboKern/ISCSI.swift
      - ../drobo_kern/Sources/DroboKern/ISCSIBefehle.swift
      - ../drobo_kern/Sources/DroboKern/GPT.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DROBO_BUNDLE_PREFIX).drobofsprobe.iscsi
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: ModuleISCSI/DroboFSProbeISCSI.entitlements
        INFOPLIST_FILE: ModuleISCSI/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Module/Bridge.h
        OTHER_SWIFT_FLAGS: ["-DISCSI_MODUL"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/../livefiles_shim"]
        OTHER_LDFLAGS: ["$(SRCROOT)/../build/liblivefiles_hfs.a", "-framework", "CoreFoundation", "-framework", "IOKit"]
