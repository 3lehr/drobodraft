# xcodegen: `xcodegen` erzeugt DroboFSProbe.xcodeproj (nicht eingecheckt). Vorher: `make -C ../` (liblivefiles_hfs.a).
name: DroboFSProbe
options:
  bundleIdPrefix: de.begod
  deploymentTarget:
    macOS: "15.4"
settings:
  base:
    DEVELOPMENT_TEAM: JR9H9Q532P
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "2.0"
targets:
  DroboFSProbe:
    type: application
    platform: macOS
    sources:
      - App
      - path: Helper/de.begod.drobohelper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.begod.drobofsprobe
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: DroboFSProbeModule
        embed: true
      - target: DroboFSProbeHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
  DroboFSProbeHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes: ["*.plist"]
      - ../drobo_kern/Sources/DroboKern/HelferLogik.swift
      - ../drobo_kern/Sources/DroboKern/Medium.swift
      - ../drobo_kern/Sources/DroboKern/Freigabe.swift
      - ../drobo_kern/Sources/DroboKern/Fehler.swift
    settings:
      base:
        PRODUCT_NAME: drobohelper
        PRODUCT_BUNDLE_IDENTIFIER: de.begod.drobohelper
        ENABLE_HARDENED_RUNTIME: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: DiskArbitration.framework
  DroboFSProbeModule:
    type: app-extension
    platform: macOS
    sources: [Module]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.begod.drobofsprobe.fsmodule
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Module/DroboFSProbeModule.entitlements
        INFOPLIST_FILE: Module/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Module/Bridge.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/../livefiles_shim"]
        OTHER_LDFLAGS: ["$(SRCROOT)/../build/liblivefiles_hfs.a", "-framework", "CoreFoundation"]
